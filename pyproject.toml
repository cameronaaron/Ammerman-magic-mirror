[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genetic-reflexions"
version = "2.0.0"
description = "A magic mirror that displays genetic traits around your reflection."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# The live webcam mirror; the poster/list/devices commands work without it.
camera = ["opencv-python>=4.9"]
# The account/upload server behind `magic-mirror serve`.
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = [
    "pytest>=8.0", "pytest-cov>=5.0", "respx>=0.21", "ruff>=0.6",
    "fastapi>=0.110", "python-multipart>=0.0.9",  # exercise the web layer in tests
]

[project.scripts]
magic-mirror = "magic_mirror.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["magic_mirror"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer's declarative API intentionally calls Option()/Argument() in defaults.
"magic_mirror/cli.py" = ["B008"]
# FastAPI's DI does the same with File()/Depends(); E501 spares the inline HTML.
"magic_mirror/web/app.py" = ["B008", "E501"]
# E501 spares the inline HTML/CSS/JS of the report template.
"magic_mirror/report.py" = ["E501"]
# Long parametrize tables read better on one line.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
