[workspace]
resolver = "2"
members = [
    "crates/genome-core",
    "crates/genome-py",
    "crates/genome-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

# Small, fast release binaries/wasm. (No panic=abort: it would turn a Rust
# panic in the Python extension into a hard interpreter abort.)
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
