[package]
name = "genome-worker"
version.workspace = true
edition.workspace = true
description = "Cloudflare Worker (WASM): parse a genome and return SNPedia traits as JSON."

[lib]
crate-type = ["cdylib"]

[dependencies]
genome-core = { path = "../genome-core" }
worker = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
# Pin to the CLI version worker-build 0.1 downloads, avoiding a shim mismatch.
wasm-bindgen = "=0.2.105"
